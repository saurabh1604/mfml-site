/* ============ design tokens (dataviz reference palette) ============ */
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,.10);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s7:#4a3aa7;
  --good:#0ca30c; --good-text:#006300; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  --wash-1:rgba(42,120,214,.12); --wash-2:rgba(235,104,52,.14); --wash-good:rgba(12,163,12,.10); --wash-crit:rgba(208,59,59,.09);
  --serif:"Charter","Iowan Old Style",Georgia,"Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --maxw:76rem; --prose:44rem;
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9;
  --good-text:#0ca30c;
  --wash-1:rgba(57,135,229,.18); --wash-2:rgba(217,89,38,.20); --wash-good:rgba(12,163,12,.14); --wash-crit:rgba(230,103,103,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#ffffff; --ink-2:#c3c2b7; --ink-muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,.10);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s7:#9085e9;
    --good-text:#0ca30c;
    --wash-1:rgba(57,135,229,.18); --wash-2:rgba(217,89,38,.20); --wash-good:rgba(12,163,12,.14); --wash-crit:rgba(230,103,103,.12);
  }
}
/* ============ base ============ */
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--serif);font-size:1.075rem;line-height:1.72;-webkit-font-smoothing:antialiased}
main{max-width:var(--maxw);margin:0 auto;padding:0 1.25rem 6rem}
h1,h2,h3,h4{font-family:var(--sans);line-height:1.22;letter-spacing:-.015em}
h1{font-size:clamp(1.9rem,4.5vw,3rem);margin:.4rem 0 .6rem;font-weight:750}
h2{font-size:clamp(1.35rem,2.6vw,1.8rem);margin:0 0 .9rem;font-weight:700}
h3{font-size:1.08rem;margin:1.6rem 0 .5rem;font-weight:700}
p{margin:.85rem 0}
a{color:var(--s1);text-decoration:none}
a:hover{text-decoration:underline}
strong{font-weight:650}
.prose{max-width:var(--prose);margin-inline:auto}
.katex{font-size:1.04em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:.25rem 0}
code{font-family:var(--mono);font-size:.86em;background:var(--surface);border:1px solid var(--ring);border-radius:6px;padding:.1em .38em}
/* ============ topbar ============ */
.topbar{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--page) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--ring)}
.topbar-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:.9rem;padding:.55rem 1.25rem;font-family:var(--sans);font-size:.86rem}
.topbar a.home{color:var(--ink-2);font-weight:600}
.topbar .crumb{color:var(--ink-muted)}
.topbar .spacer{flex:1}
.chip{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--ring);background:var(--surface);border-radius:999px;padding:.24rem .7rem;font-family:var(--sans);font-size:.8rem;color:var(--ink-2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:650}
button.ghost{font-family:var(--sans);font-size:.8rem;background:var(--surface);border:1px solid var(--ring);color:var(--ink-2);border-radius:999px;padding:.28rem .75rem;cursor:pointer}
button.ghost:hover{color:var(--ink)}
.progress-rail{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:transparent}
.progress-rail i{display:block;height:100%;width:0;background:var(--s1)}
/* ============ hero ============ */
.hero{padding:3.6rem 0 1rem;max-width:var(--prose);margin-inline:auto}
.kicker{font-family:var(--sans);font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--s1)}
.hero .lede{font-size:1.16rem;color:var(--ink-2)}
.hero .meta{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.1rem}
/* ============ sections ============ */
section.unit{margin-top:3.6rem;scroll-margin-top:4.5rem}
.sec-head{display:flex;align-items:baseline;gap:.9rem;max-width:var(--prose);margin-inline:auto}
.sec-num{font-family:var(--sans);font-weight:750;font-size:.9rem;color:var(--ink-muted);border:1px solid var(--ring);border-radius:8px;padding:.15rem .5rem;background:var(--surface);flex:none}
/* ============ callouts (companion voice) ============ */
.callout{max-width:var(--prose);border:1px solid var(--ring);border-left-width:3px;border-radius:12px;background:var(--surface);padding:.9rem 1.1rem;margin:1.3rem auto}
.callout .tag{display:block;font-family:var(--sans);font-size:.72rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;margin-bottom:.35rem}
.callout p{margin:.5rem 0}
.callout.scenario{border-left-color:var(--s1)} .callout.scenario .tag{color:var(--s1)}
.callout.intuition{border-left-color:var(--s3)} .callout.intuition .tag{color:var(--s3)}
.callout.aha{border-left-color:var(--s7)} .callout.aha .tag{color:var(--s7)}
.callout.try{border-left-color:var(--s2)} .callout.try .tag{color:var(--s2)}
.callout.watch{border-left-color:var(--serious)} .callout.watch .tag{color:var(--serious)}
.callout.remember{border-left-color:var(--ink)} .callout.remember .tag{color:var(--ink-2)}
details{max-width:var(--prose);border:1px solid var(--ring);border-radius:12px;background:var(--surface);padding:.65rem 1.1rem;margin:1rem auto}
details summary{cursor:pointer;font-family:var(--sans);font-size:.9rem;font-weight:650;color:var(--ink-2)}
details[open] summary{margin-bottom:.4rem}
/* ============ widgets ============ */
.widget{border:1px solid var(--ring);border-radius:16px;background:var(--surface);padding:1.1rem 1.2rem 1.2rem;margin:1.6rem auto;max-width:66rem;font-family:var(--sans);box-shadow:0 1px 2px rgba(11,11,11,.05),0 16px 38px -28px rgba(11,11,11,.4)}
.widget-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:.6rem;margin-bottom:.6rem}
.widget-head .w-title{font-weight:700;font-size:.98rem}
.widget-head .w-sub{color:var(--ink-muted);font-size:.82rem}
.widget svg{display:block;width:100%;height:auto}
.wrow{display:flex;flex-wrap:wrap;gap:1rem;align-items:flex-start}
.wcol{flex:1 1 300px;min-width:270px}
.controls{display:flex;flex-direction:column;gap:.55rem;font-size:.85rem}
.controls .ctl{display:grid;grid-template-columns:6.2rem 1fr 3.4rem;align-items:center;gap:.6rem}
.controls label{color:var(--ink-2);font-weight:600}
.controls output{font-family:var(--mono);font-size:.8rem;text-align:right;color:var(--ink)}
input[type=range]{accent-color:var(--s1);width:100%;margin:0}
.presets{display:flex;flex-wrap:wrap;gap:.45rem;margin:.5rem 0}
button.preset{font-family:var(--sans);font-size:.8rem;font-weight:600;border:1px solid var(--ring);background:var(--page);color:var(--ink-2);border-radius:999px;padding:.3rem .8rem;cursor:pointer}
button.preset:hover{border-color:var(--s1);color:var(--s1)}
button.preset[aria-pressed="true"]{background:var(--wash-1);border-color:var(--s1);color:var(--s1)}
.verdict{display:inline-flex;align-items:center;gap:.5rem;font-weight:650;font-size:.9rem;border-radius:10px;padding:.45rem .8rem;border:1px solid var(--ring)}
.verdict.good{color:var(--good-text);background:var(--wash-good)}
.verdict.bad{color:var(--critical);background:var(--wash-crit)}
.verdict.info{color:var(--s1);background:var(--wash-1)}
.readout{font-family:var(--mono);font-size:.82rem;color:var(--ink-2)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.tabs button{font-family:var(--sans);font-size:.85rem;font-weight:650;border:1px solid var(--ring);background:var(--page);color:var(--ink-2);border-radius:10px;padding:.42rem .9rem;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--wash-1);border-color:var(--s1);color:var(--s1)}
.pane{display:none}.pane.on{display:block}
.note{font-size:.83rem;color:var(--ink-muted);margin-top:.55rem}
/* matrices */
.mx{display:inline-grid;gap:2px;padding:.45rem .55rem;position:relative;font-family:var(--mono);font-size:.9rem}
.mx::before,.mx::after{content:"";position:absolute;top:0;bottom:0;width:8px;border:2px solid var(--ink-2);border-radius:3px}
.mx::before{left:0;border-right:none}.mx::after{right:0;border-left:none}
.mx span{padding:.22rem .5rem;border-radius:6px;text-align:center;min-width:2.1rem;transition:background .15s}
.mx span.hl-r{background:var(--wash-1)} .mx span.hl-c{background:var(--wash-2)}
.mx span.pivot{background:var(--wash-1);font-weight:700;color:var(--s1)}
.mx span.rowchg{background:var(--wash-2)}
.mx span.dead{opacity:.22;text-decoration:line-through}
.mxwrap{display:flex;flex-wrap:wrap;align-items:center;gap:.8rem;justify-content:flex-start;overflow-x:auto;padding:.3rem 0}
.opnote{font-family:var(--mono);font-size:.8rem;color:var(--s2);white-space:nowrap}
/* checks */
.check{max-width:var(--prose);border:1px solid var(--ring);border-radius:14px;background:var(--surface);padding:1rem 1.15rem;margin:1.5rem auto;font-family:var(--sans)}
.check .tag{font-size:.72rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--s2)}
.check .q{font-family:var(--serif);font-size:1.02rem;margin:.45rem 0 .75rem}
.check .opts{display:flex;flex-direction:column;gap:.5rem}
.check .opts button{text-align:left;font-family:var(--sans);font-size:.9rem;line-height:1.45;border:1px solid var(--ring);background:var(--page);color:var(--ink);border-radius:10px;padding:.55rem .8rem;cursor:pointer}
.check .opts button:hover{border-color:var(--s1)}
.check .opts button.picked-good{border-color:var(--good);background:var(--wash-good)}
.check .opts button.picked-bad{border-color:var(--critical);background:var(--wash-crit)}
.check .why{display:none;margin-top:.7rem;font-size:.9rem;border-radius:10px;padding:.6rem .8rem}
.check .why.on{display:block}
.check .why.good{background:var(--wash-good);color:var(--ink)}
.check .why.bad{background:var(--wash-crit);color:var(--ink)}
.check .why b.st-good{color:var(--good-text)}
.check .why b.st-bad{color:var(--critical)}
/* matrix editors & 3D */
.mx-edit{display:inline-grid;gap:4px;padding:.5rem .6rem;position:relative}
.mx-edit::before,.mx-edit::after{content:"";position:absolute;top:0;bottom:0;width:8px;border:2px solid var(--ink-2);border-radius:3px}
.mx-edit::before{left:0;border-right:none}.mx-edit::after{right:0;border-left:none}
.mx-edit input{width:3.4rem;border:1px solid var(--ring);background:var(--page);color:var(--ink);border-radius:7px;padding:.24rem .2rem;font-family:var(--mono);font-size:.85rem;text-align:center;-moz-appearance:textfield}
.mx-edit input::-webkit-outer-spin-button,.mx-edit input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.mx-edit input:focus{outline:2px solid var(--s1);border-color:var(--s1)}
.drag-hint{display:inline-flex;align-items:center;gap:.35rem;font-size:.75rem;color:var(--ink-muted);font-family:var(--sans)}
svg.grabbable{cursor:grab;touch-action:none}
svg.grabbable:active{cursor:grabbing}
/* toc rail + aura */
body::before{content:"";position:fixed;inset:0;background:radial-gradient(64rem 30rem at 88% -6%,var(--wash-1),transparent 62%);pointer-events:none;z-index:-1}
.toc{position:fixed;top:5.4rem;right:.9rem;width:11rem;font-family:var(--sans);font-size:.74rem;display:none;z-index:30;max-height:calc(100vh - 8rem);overflow-y:auto}
@media (min-width:1420px){.toc{display:block}}
.toc .toc-t{font-weight:750;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-muted);margin:0 0 .45rem .65rem}
.toc a{display:block;padding:.27rem .65rem;color:var(--ink-muted);border-left:2px solid var(--grid);text-decoration:none;line-height:1.35}
.toc a:hover{color:var(--ink);text-decoration:none}
.toc a.on{color:var(--s1);border-left-color:var(--s1);font-weight:650;background:var(--wash-1);border-radius:0 8px 8px 0}
/* misc */
table.plain{border-collapse:collapse;font-family:var(--sans);font-size:.88rem;margin:.8rem 0}
table.plain th,table.plain td{border:1px solid var(--grid);padding:.4rem .7rem;text-align:left}
table.plain th{background:var(--surface);font-weight:650}
.next-card{max-width:var(--prose);border:1px solid var(--ring);border-radius:16px;background:var(--surface);padding:1.2rem 1.3rem;margin:3rem auto 0;font-family:var(--sans)}
.svg-lab text{font-family:var(--sans)}
/* unit-4 extras */
.term-cards{display:flex;flex-wrap:wrap;gap:.6rem;margin:.7rem 0}
.term-card{border:1px solid var(--ring);border-radius:10px;background:var(--page);padding:.5rem .7rem;font-family:var(--mono);font-size:.85rem;cursor:default}
.term-card:hover{border-color:var(--s1);background:var(--wash-1)}
.term-card b{font-weight:700}
.stagebar{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0}
.stagebar button{font-family:var(--sans);font-size:.82rem;font-weight:650;border:1px solid var(--ring);background:var(--page);color:var(--ink-2);border-radius:10px;padding:.4rem .8rem;cursor:pointer}
.stagebar button[aria-selected="true"]{background:var(--wash-1);border-color:var(--s1);color:var(--s1)}
@media (max-width:640px){ .controls .ctl{grid-template-columns:5rem 1fr 2.8rem} }
/* unit-5 extras */
.ladder{max-width:var(--prose);margin:1.4rem auto;font-family:var(--sans)}
.rung{border:1px solid var(--ring);border-left-width:3px;border-radius:12px;background:var(--surface);padding:.7rem 1rem;margin:.5rem auto;display:flex;flex-wrap:wrap;align-items:baseline;gap:.7rem}
.rung b{font-size:.95rem}
.rung .form{font-family:var(--mono);font-size:.9rem;color:var(--s1)}
.rung .who{font-size:.8rem;color:var(--ink-muted);margin-left:auto}
.rung.r1{border-left-color:var(--s3)} .rung.r2{border-left-color:var(--s2)} .rung.r3{border-left-color:var(--s1)}
.rung-arrow{text-align:center;font-size:.78rem;color:var(--ink-muted);margin:.1rem 0}
/* practice arena */
.prob{max-width:var(--prose);border:1px solid var(--ring);border-radius:14px;background:var(--surface);padding:1rem 1.2rem;margin:1.4rem auto;font-family:var(--serif)}
.prob-head{display:flex;align-items:center;gap:.6rem;font-family:var(--sans);margin-bottom:.4rem}
.ptag{font-size:.72rem;font-weight:750;letter-spacing:.12em;text-transform:uppercase;color:var(--s1)}
.pdiff{font-size:.72rem;font-weight:700;border-radius:999px;padding:.14rem .6rem;font-family:var(--sans)}
.pdiff.easy{color:var(--good-text);background:var(--wash-good)}
.pdiff.medium{color:var(--s1);background:var(--wash-1)}
.pdiff.hard{color:var(--s2);background:var(--wash-2)}
.pq{margin:.3rem 0 .5rem}
.ptest{font-size:.9rem;color:var(--ink-2);font-family:var(--sans);margin:.4rem 0}
details.sol{border:none;background:var(--page);border:1px solid var(--ring);margin:.6rem 0 0;max-width:none}
details.sol summary{color:var(--s1);font-weight:650}
.pstep{margin:.7rem 0;padding-left:.9rem;border-left:2px solid var(--grid)}
.pstep b{font-family:var(--sans);font-size:.9rem}
.pans{margin-top:.9rem;font-weight:650;border-radius:10px;padding:.55rem .8rem;background:var(--wash-good);color:var(--ink);font-family:var(--sans);font-size:.92rem}

/* ================= MBM-UX-V2 · navigation, resume, revision, a11y, print ================= */
a.skip{position:absolute;left:-9999px;top:0;z-index:100;background:var(--s1);color:#fff;padding:.55rem 1rem;border-radius:0 0 10px 0;font-family:var(--sans);font-size:.85rem;font-weight:650;text-decoration:none}
a.skip:focus{left:0}
:focus-visible{outline:2px solid var(--s1);outline-offset:2px;border-radius:4px}
main:focus{outline:none}
/* --- topbar fits every screen --- */
.topbar-in{flex-wrap:nowrap}
.topbar a.home{white-space:nowrap;text-decoration:none}
.topbar .crumb{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
#score-chip.done{border-color:var(--good);background:var(--wash-good);color:var(--good-text)}
#score-chip.done b{color:var(--good-text)}
.hero .meta .chip{white-space:normal}
/* long display equations scroll inside their own box instead of stretching the page */
.katex-display{overflow-x:auto;overflow-y:hidden;padding-top:2px;padding-bottom:2px}
.katex-display::-webkit-scrollbar{height:5px}
.katex-display::-webkit-scrollbar-thumb{background:var(--grid);border-radius:999px}
/* wide comparison tables scroll in place rather than stretching the page */
@media (max-width:760px){
  table.plain{display:block;max-width:100%;overflow-x:auto}
}
#toc-btn{display:none;align-items:center;gap:.35rem;white-space:nowrap}
@media (max-width:1419px){#toc-btn{display:inline-flex}}
@media (max-width:899px){
  .topbar .crumb{display:none}
  .topbar-in{gap:.55rem;padding:.5rem .95rem}
}
@media (max-width:599px){
  .tw{display:none}
  button.ghost{padding:.28rem .6rem}
}
@media (max-width:430px){
  .txs{display:none}
  .topbar-in{gap:.4rem;padding:.5rem .75rem}
}
/* --- table of contents: fixed rail wide, slide-in drawer narrow --- */
.toc-close{display:none;position:absolute;top:.55rem;right:.6rem;width:1.9rem;height:1.9rem;line-height:1;border-radius:9px;border:1px solid var(--ring);background:var(--page);color:var(--ink-2);font-size:1.15rem;cursor:pointer;font-family:var(--sans)}
.toc-nav{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin-top:.9rem;padding-top:.7rem;border-top:1px solid var(--ring)}
.toc-nav a{border-left:none;padding:.3rem .35rem;color:var(--ink-2);font-weight:650;font-size:.74rem}
.toc-nav a:hover{color:var(--s1)}
.toc-nav a.hub{color:var(--ink-muted);font-weight:600}
.toc-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.38);opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:60}
.toc-backdrop.on{opacity:1;pointer-events:auto}
@media (max-width:1419px){
  /* off-canvas: visibility keeps the closed drawer out of the page's scroll width */
  .toc{display:block;position:fixed;top:0;right:0;bottom:0;left:auto;width:min(21rem,86vw);max-height:none;
       background:var(--surface);border-left:1px solid var(--ring);box-shadow:-24px 0 60px -34px rgba(0,0,0,.65);
       padding:1.15rem .75rem 2rem;font-size:.82rem;overflow-y:auto;overscroll-behavior:contain;
       visibility:hidden;transform:translateX(103%);transition:transform .24s ease,visibility 0s linear .24s;z-index:70}
  .toc.open{visibility:visible;transform:none;transition:transform .24s ease}
  .toc .toc-t{margin-bottom:.7rem}
  .toc a{padding:.42rem .7rem}
  .toc-close{display:block}
}
@media (min-width:1420px){.toc-backdrop{display:none}}
/* --- resume pill --- */
.resume{position:fixed;left:50%;bottom:1.1rem;transform:translate(-50%,140%);z-index:65;display:flex;align-items:center;gap:.6rem;
        background:var(--surface);border:1px solid var(--ring);border-radius:999px;padding:.4rem .5rem .4rem 1rem;
        box-shadow:0 18px 44px -22px rgba(11,11,11,.55);font-family:var(--sans);font-size:.82rem;max-width:min(34rem,92vw);
        transition:transform .3s cubic-bezier(.2,.8,.3,1),opacity .3s;opacity:0}
.resume.on{transform:translate(-50%,0);opacity:1}
.resume .rl{color:var(--ink-muted);white-space:nowrap}
.resume .rgo{font-family:var(--sans);font-size:.82rem;font-weight:650;border:1px solid var(--s1);background:var(--wash-1);color:var(--s1);

@media (prefers-reduced-motion:reduce){

}
